# Documentação interativa é opt-in em produção.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Produção exige HTTPS, cookie Secure e origem frontend externa explícita.
app.security.refresh-cookie.secure=${APP_REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie.same-site=${APP_REFRESH_COOKIE_SAME_SITE:Lax}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
