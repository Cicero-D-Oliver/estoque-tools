# Perfil local: não exige instalação de servidor de banco de dados.
spring.datasource.url=${SQLITE_URL:jdbc:sqlite:estoque.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jpa.database-platform=com.equipe.estoque.config.ApplicationSQLiteDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Legacy SQLite schema verified before Flyway adoption

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
