# Configurações comuns. Credenciais e URLs de banco pertencem aos perfis.
spring.application.name=estoque
spring.profiles.default=sqlite
server.port=${SERVER_PORT:8080}

# Não expõe exceções, mensagens internas ou stacktraces nas respostas HTTP.
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Mantém o acesso ao banco dentro de transações explícitas dos services.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Rejeita propriedades desconhecidas para evitar entradas silenciosamente ignoradas.
spring.jackson.deserialization.fail-on-unknown-properties=true

# CORS: origens explícitas, configuráveis por variáveis de ambiente.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Content-Type,Accept,Authorization,X-Correlation-Id,X-Organization-Id}
app.cors.exposed-headers=X-Correlation-Id
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# JWT curto. APP_JWT_SECRET deve ser Base64 de pelo menos 32 bytes e não possui padrão.
app.security.jwt-secret=${APP_JWT_SECRET}
app.security.issuer=${APP_JWT_ISSUER:estoque-tools}
app.security.access-token-ttl=${APP_ACCESS_TOKEN_TTL:15m}
app.security.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:30d}
app.security.password-reset-token-ttl=${APP_PASSWORD_RESET_TOKEN_TTL:30m}
app.security.max-failed-login-attempts=${APP_MAX_FAILED_LOGIN_ATTEMPTS:5}
app.security.login-lock-duration=${APP_LOGIN_LOCK_DURATION:15m}
app.security.refresh-cookie.secure=${APP_REFRESH_COOKIE_SECURE:false}
app.security.refresh-cookie.same-site=${APP_REFRESH_COOKIE_SAME_SITE:Lax}
app.security.refresh-cookie.path=/api/auth

# Novos cadastros públicos aceitam somente domínios corporativos explícitos.
app.registration.allowed-email-domains=${APP_ALLOWED_EMAIL_DOMAINS:scaladatacenters.com}
app.registration.public-registration-enabled=${APP_PUBLIC_REGISTRATION_ENABLED:false}

# Onboarding corporativo fechado. Nenhum token é persistido ou registrado em texto puro.
app.onboarding.initial-admin-email=${APP_INITIAL_ADMIN_EMAIL:}
app.onboarding.initial-organization-name=${APP_INITIAL_ORGANIZATION_NAME:}
app.onboarding.public-base-url=${APP_PUBLIC_BASE_URL:}
app.onboarding.email-verification-token-ttl=${APP_EMAIL_VERIFICATION_TOKEN_TTL:30m}
app.onboarding.invitation-resend-cooldown=${APP_INVITATION_RESEND_COOLDOWN:5m}

# A entrega é desabilitada por padrão. Produção exige SMTP validado no startup.
app.mail.delivery-mode=${APP_MAIL_DELIVERY_MODE:disabled}
app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

# Logs padronizados e correlacionáveis, sem payloads ou credenciais.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.equipe.estoque=${LOG_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-sem-correlacao}] %logger{36} - %msg%n

# Somente o healthcheck é exposto e sem detalhes de infraestrutura.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# O SMTP fica fora do healthcheck por padrão para que desenvolvimento/testes sem
# servidor de e-mail permaneçam saudáveis. O profile prod o habilita explicitamente.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# OpenAPI/Swagger.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
