# Perfil recomendado para ambientes compartilhados e Docker.
# DB_PASSWORD é obrigatório e não possui valor padrão intencionalmente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estoque_db}
spring.datasource.username=${DB_USERNAME:estoque}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# Não habilite baseline sem comparar um schema PostgreSQL existente com V1.
spring.flyway.baseline-on-migrate=false

spring.sql.init.mode=never
