# Perfil recomendado para ambientes compartilhados e Docker.
# DB_PASSWORD é obrigatório e não possui valor padrão intencionalmente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estoque_db}
spring.datasource.username=${DB_USERNAME:estoque}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Para produção, use JPA_DDL_AUTO=validate após adotar uma ferramenta de migração.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.sql.init.mode=${SQL_INIT_MODE:never}
