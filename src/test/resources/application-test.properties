spring.datasource.url=jdbc:sqlite:target/estoque-tests.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=com.equipe.estoque.config.ApplicationSQLiteDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# Chave conhecida exclusivamente para testes automatizados; nunca usada fora do profile test.
app.security.jwt-secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS0zMi1iISE=
app.security.access-token-ttl=15m
