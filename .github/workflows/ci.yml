name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Java 17 e cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, testes, JaCoCo, PMD e CPD
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validar suíte atual e relatórios
        shell: pwsh
        run: |
          $reports = Get-ChildItem -LiteralPath "target/surefire-reports" -Filter "TEST-*.xml"
          if ($reports.Count -eq 0) {
            throw "Nenhum relatório Surefire foi encontrado."
          }

          $expectedSuites = @(
            "com.equipe.estoque.ApplicationFlowIntegrationTest",
            "com.equipe.estoque.AuthenticationSecurityIntegrationTest",
            "com.equipe.estoque.HardeningIntegrationTest",
            "com.equipe.estoque.OrganizationDataIsolationIntegrationTest",
            "com.equipe.estoque.OrganizationAuthorizationIntegrationTest",
            "com.equipe.estoque.OrganizationsFoundationIntegrationTest",
            "com.equipe.estoque.PostgreSQLTestcontainersIntegrationTest",
            "com.equipe.estoque.ProductionSecurityConfigurationIntegrationTest",
            "com.equipe.estoque.config.SQLiteLegacyBaselineCallbackTest"
          )
          $minimumTests = 67
          $total = 0
          $executedSuites = @()
          foreach ($report in $reports) {
            [xml]$xml = Get-Content -LiteralPath $report.FullName
            $suite = $xml.testsuite
            $suiteTests = [int]$suite.tests
            if ($suiteTests -le 0) {
              throw "A suíte $($suite.name) não executou testes."
            }
            if ([int]$suite.failures -ne 0) {
              throw "A suíte $($suite.name) contém falhas."
            }
            if ([int]$suite.errors -ne 0) {
              throw "A suíte $($suite.name) contém erros."
            }
            if ([int]$suite.skipped -ne 0) {
              throw "A suíte $($suite.name) contém testes ignorados inesperados."
            }
            $total += $suiteTests
            $executedSuites += [string]$suite.name
          }

          foreach ($expectedSuite in $expectedSuites) {
            if ($executedSuites -notcontains $expectedSuite) {
              throw "Suíte obrigatória não executada: $expectedSuite"
            }
          }
          if ($total -lt $minimumTests) {
            throw "Regressão na quantidade de testes: $total; mínimo esperado: $minimumTests."
          }

          Write-Host "Suítes obrigatórias executadas sem falhas, erros ou ignorados: $total testes."
          @(
            "target/site/jacoco/jacoco.xml",
            "target/pmd.xml",
            "target/cpd.xml"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Relatório obrigatório ausente: $_"
            }
          }

      - name: Smoke test SQLite isolado
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -JarPath "target/estoque-1.0.0.jar"

      - name: Preservar relatórios de qualidade
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pmd.xml
            target/cpd.xml
