services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estoque_db}
      POSTGRES_USER: ${POSTGRES_USER:-estoque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - estoque_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgresql,prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-estoque_db}
      DB_USERNAME: ${POSTGRES_USER:-estoque}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Defina APP_JWT_SECRET Base64 com ao menos 32 bytes no arquivo .env}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-30d}
      APP_PASSWORD_RESET_TOKEN_TTL: ${APP_PASSWORD_RESET_TOKEN_TTL:-30m}
      APP_MAX_FAILED_LOGIN_ATTEMPTS: ${APP_MAX_FAILED_LOGIN_ATTEMPTS:-5}
      APP_LOGIN_LOCK_DURATION: ${APP_LOGIN_LOCK_DURATION:-15m}
      APP_ALLOWED_EMAIL_DOMAINS: ${APP_ALLOWED_EMAIL_DOMAINS:-scaladatacenters.com}
      APP_PUBLIC_REGISTRATION_ENABLED: "false"
      APP_INITIAL_ADMIN_EMAIL: ${APP_INITIAL_ADMIN_EMAIL:?Defina APP_INITIAL_ADMIN_EMAIL no arquivo .env}
      APP_INITIAL_ORGANIZATION_NAME: ${APP_INITIAL_ORGANIZATION_NAME:?Defina APP_INITIAL_ORGANIZATION_NAME no arquivo .env}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?Defina APP_PUBLIC_BASE_URL HTTPS no arquivo .env}
      APP_EMAIL_VERIFICATION_TOKEN_TTL: ${APP_EMAIL_VERIFICATION_TOKEN_TTL:-30m}
      APP_INVITATION_RESEND_COOLDOWN: ${APP_INVITATION_RESEND_COOLDOWN:-5m}
      APP_MAIL_DELIVERY_MODE: ${APP_MAIL_DELIVERY_MODE:-smtp}
      APP_MAIL_FROM: ${APP_MAIL_FROM:?Defina APP_MAIL_FROM no arquivo .env}
      MAIL_HOST: ${MAIL_HOST:?Defina MAIL_HOST no arquivo .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_CONNECTION_TIMEOUT: ${MAIL_SMTP_CONNECTION_TIMEOUT:-5000}
      MAIL_SMTP_READ_TIMEOUT: ${MAIL_SMTP_READ_TIMEOUT:-5000}
      MAIL_SMTP_WRITE_TIMEOUT: ${MAIL_SMTP_WRITE_TIMEOUT:-5000}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-true}
      APP_REFRESH_COOKIE_SECURE: ${APP_REFRESH_COOKIE_SECURE:-true}
      APP_REFRESH_COOKIE_SAME_SITE: ${APP_REFRESH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina a origem HTTPS do frontend no arquivo .env}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - estoque_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: estoque_postgres_data

networks:
  estoque_network:
    name: estoque_network
    driver: bridge
