services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estoque_db}
      POSTGRES_USER: ${POSTGRES_USER:-estoque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - estoque_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgresql,prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-estoque_db}
      DB_USERNAME: ${POSTGRES_USER:-estoque}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Defina APP_JWT_SECRET Base64 com ao menos 32 bytes no arquivo .env}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-30d}
      APP_PASSWORD_RESET_TOKEN_TTL: ${APP_PASSWORD_RESET_TOKEN_TTL:-30m}
      APP_MAX_FAILED_LOGIN_ATTEMPTS: ${APP_MAX_FAILED_LOGIN_ATTEMPTS:-5}
      APP_LOGIN_LOCK_DURATION: ${APP_LOGIN_LOCK_DURATION:-15m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - estoque_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: estoque_postgres_data

networks:
  estoque_network:
    name: estoque_network
    driver: bridge
